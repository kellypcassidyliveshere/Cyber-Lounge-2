<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Lounge & Juice Bar</title>
  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- QRCode.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&family=Poppins:wght@400;600;700&display=swap');

    :root {
      --bg-dark: #0b0c10;
      --card-bg: #151821;
      --accent-pink: #ff2a85;
      --accent-purple: #9a4dff;
      --accent-green: #00ff66;
      --accent-yellow: #ffea00;
      --accent-cyan: #00d2ff;
      --text-light: #ffffff;
      --text-muted: #a0a5b5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-light);
      padding-bottom: 100px;
      overflow-x: hidden;
    }

    .container {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px 15px;
      text-align: center;
    }

    /* --- HERO TITLE SECTION --- */
    .hero-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 15px;
      text-shadow: 0px 4px 15px rgba(255, 42, 133, 0.3);
    }

    /* Animated Headlines */
    .swipe-title {
      font-family: 'Montserrat', sans-serif;
      font-size: 2rem;
      font-weight: 900;
      text-transform: uppercase;
      margin: 5px 0;
      letter-spacing: 1.5px;
    }

    .swipe-left-1 {
      color: var(--accent-yellow);
      animation: swipeLeft 0.8s ease-out forwards;
    }

    .swipe-right {
      color: var(--accent-cyan);
      font-size: 1.6rem;
      animation: swipeRight 0.8s ease-out forwards;
    }

    .swipe-left-2 {
      background: linear-gradient(90deg, var(--accent-green), var(--accent-yellow));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: swipeLeft 0.8s ease-out forwards;
    }

    @keyframes swipeLeft {
      0% { opacity: 0; transform: translateX(-100px); }
      100% { opacity: 1; transform: translateX(0); }
    }

    @keyframes swipeRight {
      0% { opacity: 0; transform: translateX(100px); }
      100% { opacity: 1; transform: translateX(0); }
    }

    /* --- HERO DRINKS IMAGE --- */
    .hero-img {
      width: 100%;
      max-width: 450px;
      margin: 20px auto;
      display: block;
      border-radius: 12px;
    }

    /* --- TAB BUTTONS --- */
    .tab-container {
      display: flex;
      gap: 12px;
      margin: 25px 0 15px 0;
    }

    .tab-btn {
      flex: 1;
      padding: 14px 20px;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-muted);
      background: var(--card-bg);
      border: 2px solid #252a38;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
    }

    .tab-btn.active {
      color: #ffffff;
      border-color: var(--accent-cyan);
      background: linear-gradient(180deg, #1e2433 0%, var(--card-bg) 100%);
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
    }

    /* --- CONTENT PANELS --- */
    .tab-content {
      display: none;
    }
    .tab-content.active {
      display: block;
    }

    /* Drink Grid */
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 15px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 15px;
      border: 1px solid #232836;
      text-align: center;
      position: relative;
    }

    .card-img-wrapper {
      width: 110px;
      height: 110px;
      margin: 0 auto 10px auto;
      border-radius: 50%;
      padding: 5px;
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-yellow));
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card-img-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 4px;
    }

    .card-price {
      color: var(--accent-yellow);
      font-weight: 700;
      margin-bottom: 8px;
    }

    .checkbox-custom {
      width: 22px;
      height: 22px;
      accent-color: var(--accent-green);
      cursor: pointer;
    }

    /* Pod Selection Grid */
    .pod-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin: 15px 0;
    }

    .pod-btn {
      background: var(--card-bg);
      border: 1px solid #2d3345;
      color: white;
      padding: 15px 0;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1.1rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .pod-btn.selected {
      background: var(--accent-purple);
      border-color: var(--accent-pink);
      box-shadow: 0 0 12px rgba(154, 77, 255, 0.6);
    }

    /* Form Inputs */
    .form-group {
      text-align: left;
      margin-bottom: 12px;
    }

    .form-group label {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: block;
      margin-bottom: 4px;
    }

    .form-control {
      width: 100%;
      padding: 12px;
      background: var(--card-bg);
      border: 1px solid #2d3345;
      border-radius: 8px;
      color: white;
      font-size: 1rem;
    }

    .btn-action {
      width: 100%;
      padding: 14px;
      background: linear-gradient(90deg, var(--accent-purple), #b537ff);
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: 700;
      font-size: 1.05rem;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 4px 15px rgba(154, 77, 255, 0.4);
    }

    /* --- MEMBERSHIP FORM SECTION --- */
    .membership-card {
      background: var(--card-bg);
      border: 2px solid var(--accent-green);
      border-radius: 16px;
      padding: 20px;
      margin: 30px 0;
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.15);
    }

    .membership-card h3 {
      color: var(--accent-green);
      font-size: 1.4rem;
      margin-bottom: 6px;
    }

    .membership-card p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 15px;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      background: var(--accent-green);
      color: #000;
      font-weight: 800;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
    }

    /* --- SOCIAL MEDIA LINKS --- */
    .social-section {
      margin: 25px 0;
      display: flex;
      justify-content: center;
      gap: 20px;
    }

    .social-icon {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: var(--card-bg);
      border: 1px solid #2d3345;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      color: white;
      text-decoration: none;
      transition: all 0.3s ease;
    }

    .social-icon.fb:hover { color: #1877f2; border-color: #1877f2; box-shadow: 0 0 10px #1877f2; }
    .social-icon.wa:hover { color: #25d366; border-color: #25d366; box-shadow: 0 0 10px #25d366; }

    /* --- FIXED BOTTOM BAR --- */
    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #0d0e14;
      border-top: 2px solid var(--accent-purple);
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 600px;
      margin: 0 auto;
      z-index: 100;
    }

    .bottom-bar a {
      color: var(--accent-green);
      font-size: 0.75rem;
      text-decoration: underline;
    }

    .total-price {
      color: var(--accent-yellow);
      font-size: 1.2rem;
      font-weight: 800;
    }

    .btn-booster {
      background: var(--accent-cyan);
      color: #000;
      font-weight: 700;
      border: none;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
    }

    /* --- RECEIPT MODAL --- */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-content {
      background: var(--card-bg);
      border: 2px solid var(--accent-purple);
      border-radius: 16px;
      padding: 25px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      position: relative;
    }

    .close-modal {
      position: absolute;
      top: 10px; right: 15px;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
    }

    #qrcode {
      display: flex;
      justify-content: center;
      margin: 15px 0;
      padding: 10px;
      background: white;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- MAIN BLOCK TITLE -->
    <h1 class="hero-title">COMING SOON</h1>

    <!-- ANIMATED SWIPE HEADLINES -->
    <div class="swipe-title swipe-left-1">CYBER LOUNGE</div>
    <div class="swipe-title swipe-right">&amp;</div>
    <div class="swipe-title swipe-left-2">JUICE BAR</div>

    <!-- DRINKS SPLASH IMAGE -->
    <img src="https://images.unsplash.com/photo-1551024709-8f23befc6f87?auto=format&fit=crop&w=600&q=80" alt="Juices" class="hero-img">

    <!-- BUTTON TABS -->
    <div class="tab-container">
      <button class="tab-btn active" onclick="switchTab('drinks')">Drinks</button>
      <button class="tab-btn" onclick="switchTab('pods')">Pods</button>
    </div>

    <!-- DRINKS TAB CONTENT -->
    <div id="drinks-tab" class="tab-content active">
      <div class="grid">
        <div class="card">
          <div class="card-img-wrapper">
            <img src="https://images.unsplash.com/photo-1613478223719-2ab802602423?auto=format&fit=crop&w=200&q=80" alt="Kaleb Moon">
          </div>
          <div class="card-title">Kaleb Moon</div>
          <div class="card-price">$10</div>
          <input type="checkbox" class="checkbox-custom drink-item" value="10" data-name="Kaleb Moon" onchange="calculateTotal()">
        </div>

        <div class="card">
          <div class="card-img-wrapper">
            <img src="https://images.unsplash.com/photo-1534353473418-4cfa6c56fd38?auto=format&fit=crop&w=200&q=80" alt="Maia Gold">
          </div>
          <div class="card-title">Maia Gold</div>
          <div class="card-price">$11</div>
          <input type="checkbox" class="checkbox-custom drink-item" value="11" data-name="Maia Gold" onchange="calculateTotal()">
        </div>
      </div>
    </div>

    <!-- PODS TAB CONTENT -->
    <div id="pods-tab" class="tab-content">
      <h3 style="margin-bottom:10px; color:var(--text-muted);">Select a Pod</h3>
      <div class="pod-grid">
        <button class="pod-btn" onclick="selectPod(this, 1)">1</button>
        <button class="pod-btn" onclick="selectPod(this, 2)">2</button>
        <button class="pod-btn" onclick="selectPod(this, 3)">3</button>
        <button class="pod-btn" onclick="selectPod(this, 4)">4</button>
        <button class="pod-btn" onclick="selectPod(this, 5)">5</button>
        <button class="pod-btn" onclick="selectPod(this, 6)">6</button>
        <button class="pod-btn" onclick="selectPod(this, 7)">7</button>
        <button class="pod-btn" onclick="selectPod(this, 8)">8</button>
      </div>

      <div class="form-group">
        <label>Select Date</label>
        <input type="date" id="booking-date" class="form-control">
      </div>
      <div class="form-group">
        <label>Select Time</label>
        <select id="booking-time" class="form-control">
          <option>11:00 AM</option>
          <option>12:00 PM</option>
          <option>01:00 PM</option>
          <option>02:00 PM</option>
          <option>03:00 PM</option>
        </select>
      </div>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="booking-name" class="form-control" placeholder="Enter your name">
      </div>

      <button class="btn-action" onclick="generateReceipt()">Proceed to Payment</button>
    </div>

    <!-- FORMSPREE MEMBERSHIP CARD -->
    <div class="membership-card">
      <h3>JOIN MEMBERSHIP</h3>
      <p>Sign up with your email to get early access and updates.</p>
      <form action="https://formspree.io/f/your_form_id" method="POST">
        <div class="form-group">
          <input type="email" name="email" class="form-control" placeholder="Enter your email address" required style="margin-bottom: 10px;">
        </div>
        <button type="submit" class="btn-submit">JOIN MEMBERSHIP</button>
      </form>
    </div>

    <!-- SOCIAL MEDIA LINKS -->
    <div class="social-section">
      <a href="https://www.facebook.com/cyberloungejuicebar" target="_blank" class="social-icon fb"><i class="fab fa-facebook-f"></i></a>
      <a href="https://wa.me/61434195228" target="_blank" class="social-icon wa"><i class="fab fa-whatsapp"></i></a>
    </div>
  </div>

  <!-- BOTTOM BAR -->
  <div class="bottom-bar">
    <a href="https://thefoundationproject.online" target="_blank">10% of all profits fund<br>thefoundationproject.online</a>
    <div>
      <span style="font-size:0.8rem; color:var(--text-muted);">Total:</span>
      <span class="total-price" id="total-price-display">$0</span>
    </div>
    <button class="btn-booster">Add Boosters</button>
  </div>

  <!-- QR RECEIPT MODAL -->
  <div class="modal" id="receipt-modal">
    <div class="modal-content">
      <span class="close-modal" onclick="closeModal()">&times;</span>
      <h2 style="color:var(--accent-green); margin-bottom:10px;">Booking Receipt</h2>
      <div id="receipt-details" style="text-align:left; font-size:0.9rem; margin-bottom:15px; color:var(--text-muted);"></div>
      <div id="qrcode"></div>
      <p style="font-size:0.75rem; color:var(--text-muted);">Scan QR code at entry to confirm pod &amp; drink order.</p>
    </div>
  </div>

  <script>
    let selectedPodNum = null;

    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      if(tabName === 'drinks') {
        event.target.classList.add('active');
        document.getElementById('drinks-tab').classList.add('active');
      } else {
        event.target.classList.add('active');
        document.getElementById('pods-tab').classList.add('active');
      }
    }

    function selectPod(element, podNum) {
      document.querySelectorAll('.pod-btn').forEach(btn => btn.classList.remove('selected'));
      element.classList.add('selected');
      selectedPodNum = podNum;
    }

    function calculateTotal() {
      let total = 0;
      document.querySelectorAll('.drink-item:checked').forEach(item => {
        total += parseFloat(item.value);
      });
      document.getElementById('total-price-display').innerText = '$' + total;
      return total;
    }

    function generateReceipt() {
      const name = document.getElementById('booking-name').value;
      const date = document.getElementById('booking-date').value;
      const time = document.getElementById('booking-time').value;
      
      let selectedDrinks = [];
      document.querySelectorAll('.drink-item:checked').forEach(item => {
        selectedDrinks.push(item.getAttribute('data-name'));
      });

      if (!name || !date) {
        alert('Please complete your name and select a date.');
        return;
      }

      const totalAmount = calculateTotal();
      const orderSummary = `Name: ${name}\nPod: ${selectedPodNum || 'None'}\nDate: ${date} ${time}\nDrinks: ${selectedDrinks.join(', ') || 'None'}\nTotal: $${totalAmount}`;

      document.getElementById('receipt-details').innerHTML = `
        <p><strong>Customer:</strong> ${name}</p>
        <p><strong>Pod:</strong> ${selectedPodNum ? 'Pod #' + selectedPodNum : 'None'}</p>
        <p><strong>Slot:</strong> ${date} @ ${time}</p>
        <p><strong>Drinks:</strong> ${selectedDrinks.join(', ') || 'None'}</p>
        <p><strong>Total Paid:</strong> $${totalAmount}</p>
      `;

      // Clear previous QR Code
      document.getElementById('qrcode').innerHTML = '';

      // Generate New QR Code
      new QRCode(document.getElementById("qrcode"), {
        text: orderSummary,
        width: 128,
        height: 128
      });

      document.getElementById('receipt-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('receipt-modal').style.display = 'none';
    }
  </script>
</body>
</html>
