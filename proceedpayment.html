<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Select Payment Method</title>
  <!-- QRCode.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0d0d0f;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .card {
      background-color: #16161e;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }
    h2 {
      color: #00ff66;
      text-align: center;
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 1.25rem;
      letter-spacing: 0.5px;
    }
    .price-display {
      text-align: center;
      font-size: 1.5rem;
      font-weight: bold;
      color: #ffffff;
      margin-bottom: 20px;
      background: #20202c;
      padding: 12px;
      border-radius: 8px;
    }
    .input-group {
      margin-bottom: 20px;
    }
    .input-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.9rem;
      color: #a0a0b0;
    }
    .input-group input {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #2e2e3e;
      background-color: #20202c;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }
    .input-group input:focus {
      border-color: #00ff66;
    }
    .payment-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 20px;
    }
    .method-btn {
      background-color: #20202c;
      border: 1px solid transparent;
      color: #ffffff;
      padding: 14px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .method-btn.selected {
      border-color: #00ff66;
      background-color: #282838;
    }
    .action-btn {
      width: 100%;
      background-color: #00ff66;
      color: #000000;
      border: none;
      padding: 16px;
      border-radius: 10px;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .action-btn:hover {
      background-color: #00e65c;
    }
    /* Receipt Styles */
    #receipt-section {
      display: none;
      text-align: center;
    }
    .qrcode-container {
      background: #ffffff;
      padding: 16px;
      border-radius: 12px;
      display: inline-block;
      margin: 16px 0;
    }
    .receipt-details {
      font-size: 0.9rem;
      color: #a0a0b0;
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .receipt-details strong {
      color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- Payment Selection State -->
  <div class="card" id="payment-card">
    <h2>SELECT PAYMENT METHOD</h2>

    <div class="price-display">
      Total: $<span id="total-amount">0.00</span>
    </div>

    <div class="input-group">
      <label for="username">Gamer Username</label>
      <input type="text" id="username" placeholder="Enter your username" required />
    </div>

    <div class="payment-grid">
      <button class="method-btn selected" type="button" onclick="selectMethod(this)">💳 Google Pay</button>
      <button class="method-btn" type="button" onclick="selectMethod(this)">🍎 Apple Pay</button>
      <button class="method-btn" type="button" onclick="selectMethod(this)">💳 Credit Card</button>
      <button class="method-btn" type="button" onclick="selectMethod(this)">💵 Cash at Bar</button>
    </div>

    <button class="action-btn" onclick="processPayment()">Complete Payment</button>
  </div>

  <!-- Receipt State -->
  <div class="card" id="receipt-section">
    <h2>PAYMENT SUCCESSFUL</h2>
    
    <div class="qrcode-container" id="qrcode"></div>

    <div class="receipt-details">
      <div>Receipt #: <strong id="receipt-num"></strong></div>
      <div>Username: <strong id="display-username"></strong></div>
      <div>Amount Paid: <strong id="display-amount"></strong></div>
    </div>

    <button class="action-btn" onclick="location.href='gamerslounge.html'">Enter Gamers Lounge</button>
  </div>

  <script>
    // 1. Get total price passed from URL (e.g. payment.html?total=15.00)
    const urlParams = new URLSearchParams(window.location.search);
    const total = urlParams.get('total') || '0.00';
    document.getElementById('total-amount').textContent = parseFloat(total).toFixed(2);

    // 2. Payment Method Selection Handler
    function selectMethod(element) {
      document.querySelectorAll('.method-btn').forEach(btn => btn.classList.remove('selected'));
      element.classList.add('selected');
    }

    // 3. Process Payment & Generate Receipt
    function processPayment() {
      const usernameInput = document.getElementById('username').value.trim();
      
      if (!usernameInput) {
        alert('Please enter your username before proceeding.');
        return;
      }

      // Generate random receipt number
      const receiptNumber = 'REC-' + Math.floor(100000 + Math.random() * 900000);

      // Populate Receipt Details
      document.getElementById('receipt-num').textContent = receiptNumber;
      document.getElementById('display-username').textContent = usernameInput;
      document.getElementById('display-amount').textContent = '$' + parseFloat(total).toFixed(2);

      // Generate QR Code containing receipt data JSON
      const qrData = JSON.stringify({
        receipt: receiptNumber,
        user: usernameInput,
        amount: total,
        status: "PAID"
      });

      new QRCode(document.getElementById("qrcode"), {
        text: qrData,
        width: 160,
        height: 160,
        colorDark : "#000000",
        colorLight : "#ffffff",
        correctLevel : QRCode.CorrectLevel.H
      });

      // Hide payment form and show receipt
      document.getElementById('payment-card').style.display = 'none';
      document.getElementById('receipt-section').style.display = 'block';
    }
  </script>
</body>
</html>
