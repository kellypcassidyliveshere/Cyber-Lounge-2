<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <style>
        :root {
            --bg-color: #0f0f13;
            --card-bg: #181820;
            --accent-green: #2ecc71;
            --accent-purple: #8e44ad;
            --accent-blue: #3498db;
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            text-align: center;
        }

        .header-title {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--accent-purple);
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .summary-card {
            background-color: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            border: 1px solid #2a2a36;
        }

        .total-label {
            color: #aaa;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .total-amount {
            font-size: 2.2rem;
            color: var(--accent-green);
            font-weight: bold;
        }

        .section-title {
            text-align: left;
            color: var(--accent-blue);
            font-weight: bold;
            margin-bottom: 12px;
            font-size: 1rem;
        }

        .payment-methods {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .payment-option input {
            display: none;
        }

        .payment-label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background-color: var(--card-bg);
            border: 2px solid #272a3c;
            border-radius: 12px;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .payment-option input:checked + .payment-label {
            border-color: var(--accent-green);
            background-color: #1a2d24;
            color: var(--accent-green);
        }

        .card-details-form {
            display: none;
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            text-align: left;
            border: 1px solid #272a3c;
        }

        .form-group {
            margin-bottom: 10px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: #aaa;
            margin-bottom: 5px;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            background-color: #0f0f13;
            border: 1px solid #333;
            border-radius: 6px;
            color: #fff;
        }

        .btn-pay {
            width: 100%;
            padding: 16px;
            background-color: var(--accent-green);
            border: none;
            border-radius: 12px;
            color: #000;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: var(--card-bg);
            border: 2px solid var(--accent-green);
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            max-width: 380px;
            width: 100%;
        }

        .receipt-number {
            font-size: 1.4rem;
            color: #f1c40f;
            font-weight: bold;
            margin: 10px 0;
            letter-spacing: 1px;
        }

        .qr-container {
            margin: 15px auto;
            text-align: center;
            min-height: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .qr-container img {
            width: 150px;
            height: 150px;
            border-radius: 8px;
            border: 2px solid #fff;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-title">Checkout</div>

        <div class="summary-card">
            <div class="total-label">Order Total</div>
            <div id="final-total" class="total-amount">$0</div>
        </div>

        <div class="section-title">Choose Payment Method</div>
        
        <div class="payment-methods">
            <div class="payment-option">
                <input type="radio" name="payment" id="gpay" value="Google Pay" onchange="toggleCardForm()">
                <label for="gpay" class="payment-label">Google Pay</label>
            </div>
            <div class="payment-option">
                <input type="radio" name="payment" id="applepay" value="Apple Pay" onchange="toggleCardForm()">
                <label for="applepay" class="payment-label">Apple Pay</label>
            </div>
            <div class="payment-option">
                <input type="radio" name="payment" id="card" value="Credit Card" onchange="toggleCardForm()">
                <label for="card" class="payment-label">Credit Card</label>
            </div>
            <div class="payment-option">
                <input type="radio" name="payment" id="cash" value="Cash" onchange="toggleCardForm()">
                <label for="cash" class="payment-label">Cash</label>
            </div>
        </div>

        <div id="card-details-form" class="card-details-form">
            <div class="form-group">
                <label for="card-num">Card Number</label>
                <input type="text" id="card-num" placeholder="4532 •••• •••• ••••">
            </div>
            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex: 1;">
                    <label for="expiry">Expiry</label>
                    <input type="text" id="expiry" placeholder="MM/YY">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label for="cvv">CVV</label>
                    <input type="text" id="cvv" placeholder="123">
                </div>
            </div>
        </div>

        <button class="btn-pay" onclick="completePayment()">PAY NOW</button>
    </div>

    <!-- Receipt Confirmation Modal -->
    <div id="receipt-modal" class="modal">
        <div class="modal-content">
            <h2 style="color: var(--accent-green);">Payment Complete!</h2>
            <p style="margin-top: 10px; color: #aaa;">Your receipt number is:</p>
            <div id="receipt-id" class="receipt-number">#CLJ-000000</div>
            
            <div class="qr-container">
                <img id="qr-img" src="" alt="Receipt QR Code" style="display: none;" />
            </div>

            <p style="margin-bottom: 20px; font-size: 0.9rem;">Thank you for your order!</p>
            <button class="btn-pay" onclick="finishOrder()">RETURN TO HOME</button>
        </div>
    </div>

    <script>
        // Reads cost from addboosters.html via localStorage
        window.onload = function() {
            let total = localStorage.getItem('finalTotal') || localStorage.getItem('drinkTotal') || "14";
            if (!total.toString().startsWith('$')) {
                total = '$' + total;
            }
            document.getElementById('final-total').innerText = total;
        };

        function toggleCardForm() {
            const isCard = document.getElementById('card').checked;
            document.getElementById('card-details-form').style.display = isCard ? 'block' : 'none';
        }

        function completePayment() {
            const selectedMethod = document.querySelector('input[name="payment"]:checked');
            if (!selectedMethod) {
                alert("Please select a payment method.");
                return;
            }

            // Generate receipt ID
            const receiptNum = "CLJ-" + Math.floor(100000 + Math.random() * 900000);
            document.getElementById("receipt-id").innerText = "#" + receiptNum;

            // Generate QR code via image URL API
            const qrImage = document.getElementById("qr-img");
            qrImage.src = "https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=" + encodeURIComponent(receiptNum);
            qrImage.style.display = "inline-block";

            // Display modal
            document.getElementById("receipt-modal").style.display = "flex";
        }

        function finishOrder() {
            localStorage.removeItem('drinkTotal');
            localStorage.removeItem('finalTotal');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
